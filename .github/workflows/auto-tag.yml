name: Auto Release

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from build.gradle
        id: version
        run: |
          # Extract version from build.gradle
          VERSION=$(grep "^version " build.gradle | awk -F"'" '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Search for changelog
        id: changelog
        run: |
          # Try to find changelog files
          if [ -f "CHANGELOG.md" ]; then
            echo "found=CHANGELOG.md" >> $GITHUB_OUTPUT
          elif [ -f "CHANGELOG" ]; then
            echo "found=CHANGELOG" >> $GITHUB_OUTPUT
          elif [ -f "CHANGES.md" ]; then
            echo "found=CHANGES.md" >> $GITHUB_OUTPUT
          else
            echo "found=none" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Get commits since last release
          NOTES="## What's New\n\n"

          # Try to get changelog content first
          if [ "${{ steps.changelog.outputs.found }}" != "none" ]; then
            CHANGELOG_FILE="${{ steps.changelog.outputs.found }}"
            # Extract content for this version
            if grep -q "## $VERSION" "$CHANGELOG_FILE"; then
              sed -n "/## $VERSION/,/## /p" "$CHANGELOG_FILE" | head -n -1 > release_notes.md
            else
              echo "No specific changelog entry for $VERSION" > release_notes.md
            fi
          fi

          # Fallback to git log summary
          if [ ! -s release_notes.md ] || [ $(wc -l < release_notes.md) -lt 3 ]; then
            NOTES="$NOTES### Changes since last release:\n\n"

            # Get recent commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD | head -20)

            if [ -n "$COMMITS" ]; then
              NOTES="$NOTES$COMMITS\n\n"
            else
              NOTES="$NOTESNo commit history available\n\n"
            fi
          fi

          # Add version info
          {
            echo "## LeechText $VERSION"
            echo ""
            echo "### Changes"
            echo ""
            cat release_notes.md 2>/dev/null || echo "See commit history for changes."
            echo ""
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "**macOS:**"
            echo "- Download \`LeechText.dmg\`"
            echo "- Open and drag to Applications"
            echo ""
            echo "**Linux:**"
            echo "- Download \`leechtext_${VERSION}_amd64.deb\`"
            echo "- Install with: \`sudo dpkg -i leechtext_*.deb\`"
            echo ""
            echo "**Windows:**"
            echo "- Download \`LeechText.exe\`"
            echo "- Run installer and follow prompts"
          } > release_notes.md

          # Set output for next step
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LeechText ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: leechtext-native-*
          path: artifacts
          merge-multiple: true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
