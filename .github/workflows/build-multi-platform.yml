name: Build Multi-Platform

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: make
          update: true
          msystem: MINGW64

      - name: Verify tools
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Make version:"
          make --version || echo "Make not found"
          echo "jpackage check:"
          jpackage --version || echo "jpackage not found"

      - name: Build JAR with Make
        run: make build
        shell: bash

      - name: Create native package
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            make package-mac
          elif [ "${{ runner.os }}" == "Windows" ]; then
            make package-windows
          else
            make package-linux
          fi

      - name: Check package directory
        shell: bash
        run: |
          echo "Package directory contents:"
          ls -la build/jpackage/ || echo "Directory does not exist"

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: leechtext-native-${{ matrix.platform }}
          path: build/jpackage/
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from build.gradle
        id: version
        run: |
          VERSION=$(grep "^version " build.gradle | awk -F"'" '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists, skipping release creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist, will create release"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *.*; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
                md5sum "$file" > "$file.md5"
              fi
            done
            cd ..
          done

      - name: Generate release notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMITS=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD | head -20)

          {
            echo "## LeechText $VERSION"
            echo ""
            echo "### Changes since last release:"
            echo ""
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "No commit history available"
            fi
            echo ""
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "**macOS:**"
            echo "- Download \`LeechText.dmg\`"
            echo "- Open and drag to Applications"
            echo ""
            echo "**Linux:**"
            echo "- Download \`leechtext_${VERSION}_amd64.deb\`"
            echo "- Install with: \`sudo dpkg -i leechtext_*.deb\`"
            echo ""
            echo "**Windows:**"
            echo "- Download \`LeechText.exe\`"
            echo "- Run installer and follow prompts"
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LeechText ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev build artifacts
        if: steps.check_tag.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leechtext-dev-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: artifacts/**/*
          retention-days: 7
