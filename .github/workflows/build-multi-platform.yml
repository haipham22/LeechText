name: Build Desktop

on:
  push:
    tags: ['v*']
  # Build nặng (jar/apk/ipa/deb/dmg/msi) chỉ chạy khi có tag — push main chỉ qua
  # code-quality.yml. Auto Release push tag bằng GITHUB_TOKEN → không fire
  # "push tag" event; workflow_run là ngoại lệ duy nhất trigger sau workflow khác.
  workflow_run:
    workflows: ['Auto Release']
    types: [completed]
  workflow_dispatch: # trigger tay khi cần (chọn tag ở UI để release lại)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release job cần tạo release — GITHUB_TOKEN mặc định read-only
permissions:
  contents: write

# Mỗi build job upload artifact retention-days: 1 (quota gần 0 — từng bị đầy 7.7GB
# với retention 90 ngày, 260903) → release job chỉ download + attach vào release,
# không build lại. iOS chỉ smoke compile (simulator app không phân phối được).
jobs:
  # Lint + test — gate: fail thì jar/native/release không chạy (owner 260906)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint (ktlint + detekt)
        run: ./gradlew spotlessCheck detekt

      - name: Test engine + app-shared
        run: ./gradlew :engine:jvmTest :app-shared:jvmTest

  # Fat jar cross-platform — chỉ chạy sau khi test xanh
  jar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar
        run: ./gradlew :desktop-app:fatJar -x test

      - name: Smoke test — jar khởi động không crash
        run: |
          # GUI jar: sống qua 15s mà không exit non-zero = launch được (124 = timeout, ok).
          # Runner headless → cần Xvfb, không là HeadlessException ngay getDefaultScreenDevice.
          # -k 5: SIGKILL sau 5s — Compose giữ non-daemon thread, TERM không đủ.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          # 124 = chết vì TERM đúng hạn; 137 = sống qua TERM, phải SIGKILL (Compose 1.12
          # giữ thread non-daemon) — cả hai đều là "launch được, sống tới khi bị giết"
          xvfb-run -a timeout -k 5 15 java -jar desktop-app/build/libs/leechtext-desktop-*.jar || rc=$?
          test ${rc:-0} -eq 124 -o ${rc:-0} -eq 137
          ls -lh desktop-app/build/libs/

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-jar
          path: desktop-app/build/libs/leechtext-desktop-*.jar
          retention-days: 1

  # Android APK (release ký debug-key → cài trực tiếp) — build 1 lần, upload artifact.
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: |
          ./gradlew :android-app:assembleRelease
          VERSION="$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          cp android-app/build/outputs/apk/release/android-app-release.apk \
            "android-app/build/outputs/apk/release/leechtext-android-${VERSION}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: android-app/build/outputs/apk/release/leechtext-android-*.apk
          retention-days: 1

  # iOS — build device unsigned + đóng gói IPA (người cài tự ký qua Sideloadly/AltStore;
  # signed IPA/TestFlight cần Apple Developer account — làm khi có).
  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build iOS device app (unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p iosApp/build/Payload
          cp -R "iosApp/build/Build/Products/Release-iphoneos/LeechText.app" iosApp/build/Payload/
          (cd iosApp/build && zip -qry leechtext-ios.ipa Payload)
          VERSION="$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          mv iosApp/build/leechtext-ios.ipa "leechtext-ios-${VERSION}.ipa"

      - uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: leechtext-ios-*.ipa
          retention-days: 1

  # jpackage native installer — mỗi OS build trên runner của nó.
  # mac/windows bật từ 260916 (release 2.0.0 full 3 nền tảng).
  # Không upload artifact — release job build lại (tránh quota).
  native:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: leechtext-linux-deb
          - os: macos-latest
            artifact: leechtext-macos-dmg
          - os: windows-latest
            artifact: leechtext-windows-msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build native installer (jpackage)
        run: ./gradlew :desktop-app:packageReleaseDistributionForCurrentOS

      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.artifact }}
          path: |
            desktop-app/build/compose/binaries/main-release/deb/*.deb
            desktop-app/build/compose/binaries/main-release/dmg/*.dmg
            desktop-app/build/compose/binaries/main-release/msi/*.msi
          retention-days: 1

  release:
    # push tag trực tiếp (github.ref = tag) HOẶC chạy từ Auto Release (workflow_run —
    # tag v$app.version vừa được tạo trên head sha này)
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_run'
    needs: [jar, native, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # workflow_run: ref là default branch — đọc tag v$app.version vừa tạo để release đúng chỗ
      - name: Resolve tag
        if: github.event_name == 'workflow_run'
        id: tag
        run: |
          name="v$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Tag có hậu tố (v2.0.1-rc1) → GitHub prerelease, không chiếm chỗ Latest
          echo "prerelease=$([[ "$name" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: '!*tests*'
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_run' && steps.tag.outputs.name || github.ref_name }}
          # rc/beta → prerelease; bản final (không hậu tố) → release Latest
          prerelease: ${{ github.event_name == 'workflow_run' && steps.tag.outputs.prerelease == 'true' || contains(github.ref_name, '-') }}
          # Notes tự sinh kiểu open-source: full commit list từ tag trước + link So sánh
          generate_release_notes: true
          files: release-assets/**
