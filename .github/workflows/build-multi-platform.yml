name: Build Multi-Platform

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: make
          update: true
          msystem: MINGW64

      - name: Verify tools
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Make version:"
          make --version || echo "Make not found"
          echo "jpackage check:"
          jpackage --version || echo "jpackage not found"

      - name: Build JAR with Make
        run: make build
        shell: bash

      - name: Create native package
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            make package-mac
          elif [ "${{ runner.os }}" == "Windows" ]; then
            make package-windows
          else
            make package-linux
          fi

      - name: Check package directory
        shell: bash
        run: |
          echo "Package directory contents:"
          ls -la build/jpackage/ || echo "Directory does not exist"

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: leechtext-native-${{ matrix.platform }}
          path: build/jpackage/
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *.*; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
                md5sum "$file" > "$file.md5"
              fi
            done
            cd ..
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
