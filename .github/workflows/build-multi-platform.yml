name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Auto Release push tag bằng GITHUB_TOKEN → không fire "push tag" event.
  # workflow_run là ngoại lệ duy nhất được trigger sau workflow khác (cùng repo).
  workflow_run:
    workflows: ['Auto Release']
    types: [completed]
  workflow_dispatch: # trigger tay khi cần (vd tag tạo trước workflow này)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release job cần tạo release — GITHUB_TOKEN mặc định read-only
permissions:
  contents: write

# Không dùng artifacts trung gian — quota artifact đầy 1 lần (7.7GB, 260903).
# Release job tự build lại jar+deb rồi upload THẲNG vào release (không tính quota).
# Đổi đổi: build 2 lần khi release — runner phút rẻ hơn головache quota.
jobs:
  # Lint + test — gate: fail thì jar/native/release không chạy (owner 260906)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint (ktlint + detekt)
        run: ./gradlew spotlessCheck detekt

      - name: Test engine + app-shared
        run: ./gradlew :engine:jvmTest :app-shared:jvmTest

  # Fat jar cross-platform — chỉ chạy sau khi test xanh
  jar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar
        run: ./gradlew :desktop-app:fatJar -x test

      - name: Smoke test — jar khởi động không crash
        run: |
          # GUI jar: sống qua 15s mà không exit non-zero = launch được (124 = timeout, ok).
          # Runner headless → cần Xvfb, không là HeadlessException ngay getDefaultScreenDevice.
          # -k 5: SIGKILL sau 5s — Compose giữ non-daemon thread, TERM không đủ.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          # 124 = chết vì TERM đúng hạn; 137 = sống qua TERM, phải SIGKILL (Compose 1.12
          # giữ thread non-daemon) — cả hai đều là "launch được, sống tới khi bị giết"
          xvfb-run -a timeout -k 5 15 java -jar desktop-app/build/libs/leechtext-desktop-*.jar || rc=$?
          test ${rc:-0} -eq 124 -o ${rc:-0} -eq 137
          ls -lh desktop-app/build/libs/

  # jpackage native installer — mỗi OS build trên runner của nó.
  # mac/windows bật từ 260916 (release 2.0.0 full 3 nền tảng).
  # Không upload artifact — release job build lại (tránh quota).
  native:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: leechtext-linux-deb
          - os: macos-latest
            artifact: leechtext-macos-dmg
          - os: windows-latest
            artifact: leechtext-windows-msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build native installer (jpackage) — smoke, không lưu artifact
        run: ./gradlew :desktop-app:packageReleaseDistributionForCurrentOS

  release:
    # push tag trực tiếp (github.ref = tag) HOẶC chạy từ Auto Release (workflow_run —
    # tag v$app.version vừa được tạo trên head sha này)
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_run'
    needs: [jar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # workflow_run: ref là main — đọc tag v$app.version vừa tạo để release đúng chỗ
      - name: Resolve tag
        if: github.event_name == 'workflow_run'
        id: tag
        run: echo "name=v$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build jar + deb (upload thẳng release, không qua artifact)
        run: |
          ./gradlew :desktop-app:fatJar -x test
          ./gradlew :desktop-app:packageReleaseDistributionForCurrentOS
          ls -lh desktop-app/build/libs/ desktop-app/build/compose/binaries/main-release/deb/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_run' && steps.tag.outputs.name || github.ref_name }}
          # Notes tự sinh kiểu open-source: full commit list từ tag trước + link So sánh
          generate_release_notes: true
          files: |
            desktop-app/build/libs/leechtext-desktop-*.jar
            desktop-app/build/compose/binaries/main-release/deb/*.deb
            desktop-app/build/compose/binaries/main-release/dmg/*.dmg
            desktop-app/build/compose/binaries/main-release/msi/*.msi
