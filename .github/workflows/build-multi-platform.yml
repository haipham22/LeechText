name: Build Multi-Platform

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        include:
          - os: macos-latest
            platform: mac
            arch: universal
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: make
          update: true
          msystem: MINGW64

      - name: Verify tools
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Make version:"
          make --version || echo "Make not found"
          echo "jpackage check:"
          jpackage --version || echo "jpackage not found"

      - name: Build JAR with Make
        run: make build
        shell: bash

      - name: Create native package
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            make package-mac
          elif [ "${{ runner.os }}" == "Windows" ]; then
            make package-windows
          else
            make package-linux
          fi

      - name: Check package directory
        shell: bash
        run: |
          echo "Package directory contents:"
          ls -la build/jpackage/ || echo "Directory does not exist"

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: leechtext-native-${{ matrix.platform }}
          path: build/jpackage/
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "^app.version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists, skipping release creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist, will create release"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *.*; do
              if [ -f "$file" ]; then
                sha256sum "$file" > "$file.sha256"
                md5sum "$file" > "$file.md5"
              fi
            done
            cd ..
          done

      - name: Generate release notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Categorize commits since last tag
          FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" | grep -iE "^feat" | head -10)
          FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" | grep -iE "^fix" | head -10)
          OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" | grep -vEi "^(feat|fix|chore|docs|test|refactor|build|ci)" | head -5)

          {
            echo "## 🚀 LeechText $VERSION"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHER" | sed 's/^/- /'
              echo ""
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              echo "### 📝 Changes"
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" | head -20
              echo ""
            fi
            echo "---"
            echo ""
            echo "### 📦 Installation"
            echo ""
            echo "**macOS (Universal):**"
            echo "- Download \`LeechText.dmg\`"
            echo "- Open and drag to Applications folder"
            echo ""
            echo "**Linux (Debian/Ubuntu):**"
            echo "- Download \`leechtext_${VERSION}_amd64.deb\`"
            echo "- Install: \`sudo apt install ./leechtext_${VERSION}_amd64.deb\`"
            echo ""
            echo "**Windows (x64):**"
            echo "- Download \`LeechText-setup.exe\`"
            echo "- Run installer and follow prompts"
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LeechText ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev build artifacts
        if: steps.check_tag.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leechtext-dev-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: artifacts/**/*
          retention-days: 7
