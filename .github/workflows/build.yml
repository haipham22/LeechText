name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # Build and test on all platforms
  build:
    name: Build and Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [8, 11, 17]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Run code quality checks
      run: ./gradlew check --no-daemon

    - name: Generate Javadoc
      run: ./gradlew javadoc --no-daemon

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-java${{ matrix.java }}
        path: |
          build/test-results/
          build/reports/tests/
        retention-days: 30

    - name: Upload Javadoc
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: javadoc-${{ matrix.os }}-java${{ matrix.java }}
        path: build/docs/javadoc/
        retention-days: 30

  # Cross-platform compatibility test
  compatibility:
    name: Cross-Platform Compatibility
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Test cross-platform compatibility
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew distZip

  # Security and dependency checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Check for vulnerable dependencies
      run: ./gradlew dependencyCheckAnalyze --no-daemon

    - name: Upload dependency check report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-report
        path: build/reports/dependency-check-report.html
        retention-days: 30

  # Code quality and coverage
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run code coverage
      run: ./gradlew jacocoTestReport --no-daemon

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/
        retention-days: 30

    - name: Run SonarQube analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./gradlew sonarqube --no-daemon
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  # Release build and packaging
  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [build, compatibility, security, quality]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build release artifacts
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew distZip
        ./gradlew distTar

    - name: Create platform-specific builds
      run: |
        # Create macOS build
        ./gradlew jpackage --no-daemon -Ptarget=mac

        # Create Windows build
        ./gradlew jpackage --no-daemon -Ptarget=win

        # Create Linux build
        ./gradlew jpackage --no-daemon -Ptarget=linux

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: |
          build/distributions/
          build/jpackage/
        retention-days: 90

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/distributions/*.zip
          build/distributions/*.tar
          build/jpackage/*.dmg
          build/jpackage/*.exe
          build/jpackage/*.deb
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Nightly builds
  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build nightly version
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew distZip

    - name: Upload nightly build
      uses: actions/upload-artifact@v3
      with:
        name: nightly-build-${{ github.run_number }}
        path: build/distributions/
        retention-days: 7
