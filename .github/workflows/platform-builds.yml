name: Platform-Specific Builds

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - macos
        - windows
        - linux

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # macOS Build
  macos-build:
    name: Build macOS Package
    runs-on: macos-latest
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' || github.event.inputs.platform == null

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build macOS application
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew jpackage --no-daemon -Ptarget=mac

    - name: Create DMG package
      run: |
        # Create DMG using create-dmg if available
        if command -v create-dmg &> /dev/null; then
          create-dmg \
            --volname "LeechText" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "LeechText.app" 200 190 \
            --hide-extension "LeechText.app" \
            --app-drop-link 600 185 \
            "build/distributions/LeechText-macOS.dmg" \
            "build/jpackage/"
        else
          # Fallback: copy app to distribution folder
          cp -r build/jpackage/LeechText.app build/distributions/
        fi

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          build/distributions/
          build/jpackage/
        retention-days: 90

  # Windows Build
  windows-build:
    name: Build Windows Package
    runs-on: windows-latest
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || github.event.inputs.platform == null

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build Windows application
      run: |
        .\gradlew.bat clean
        .\gradlew.bat build -x test
        .\gradlew.bat jpackage --no-daemon -Ptarget=win

    - name: Create Windows installer
      run: |
        # Additional Windows-specific packaging if needed
        echo "Windows build completed"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          build/distributions/
          build/jpackage/
        retention-days: 90

  # Linux Build
  linux-build:
    name: Build Linux Package
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || github.event.inputs.platform == null

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          fakeroot \
          dpkg-dev \
          rpm \
          rpm-build \
          alien \
          libfuse2

    - name: Build Linux application
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew jpackage --no-daemon -Ptarget=linux

    - name: Create Linux packages
      run: |
        # Create DEB package
        if [ -d "build/jpackage/LeechText" ]; then
          cd build/jpackage
          fakeroot dpkg-deb --build LeechText LeechText.deb
          mv LeechText.deb ../distributions/
          cd ../..
        fi

        # Create RPM package (convert from DEB)
        if [ -f "build/distributions/LeechText.deb" ]; then
          cd build/distributions
          alien -r LeechText.deb
          cd ../..
        fi

        # Create AppImage
        if [ -d "build/jpackage/LeechText" ]; then
          echo "AppImage creation would go here"
        fi

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          build/distributions/
          build/jpackage/
        retention-days: 90

  # Cross-platform distribution
  distribution:
    name: Create Distribution Packages
    runs-on: ubuntu-latest
    needs: [macos-build, windows-build, linux-build]
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == null

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Create distribution archive
      run: |
        mkdir -p dist
        cp -r artifacts/macos-build/* dist/ 2>/dev/null || true
        cp -r artifacts/windows-build/* dist/ 2>/dev/null || true
        cp -r artifacts/linux-build/* dist/ 2>/dev/null || true

        # Create platform-specific archives
        cd dist

        # macOS
        if [ -d "LeechText.app" ]; then
          tar -czf LeechText-macOS.tar.gz LeechText.app/
        fi

        # Windows
        if [ -d "LeechText" ] && [ -f "LeechText.exe" ]; then
          zip -r LeechText-Windows.zip LeechText/ LeechText.exe
        fi

        # Linux
        if [ -d "LeechText" ]; then
          tar -czf LeechText-Linux.tar.gz LeechText/
        fi

        # Create universal archive
        cd ..
        tar -czf LeechText-Universal.tar.gz dist/

    - name: Upload distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: distribution-packages
        path: dist/
        retention-days: 90

  # Docker container builds
  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == null

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker images
      run: |
        # Build multi-platform Docker image
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/leechtext:latest \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/leechtext:${{ github.sha }} \
          --file Dockerfile \
          --push .

    - name: Upload Docker artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          Dockerfile
          .dockerignore
        retention-days: 30

  # Release deployment
  deploy:
    name: Deploy Release
    runs-on: ubuntu-latest
    needs: [distribution, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download distribution artifacts
      uses: actions/download-artifact@v3
      with:
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/*.deb
          dist/*.rpm
        draft: false
        prerelease: false
        generate_release_notes: true
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        destination_dir: /
