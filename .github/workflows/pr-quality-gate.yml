name: Pull Request Quality Gate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # Code quality checks
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run code formatting check
      run: ./gradlew spotlessCheck --no-daemon

    - name: Run code style check
      run: ./gradlew checkstyleMain checkstyleTest --no-daemon

    - name: Run static analysis
      run: ./gradlew pmdMain pmdTest --no-daemon

    - name: Run bug detection
      run: ./gradlew spotbugsMain spotbugsTest --no-daemon

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: |
          build/reports/checkstyle/
          build/reports/pmd/
          build/reports/spotbugs/
        retention-days: 30

  # Security checks
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Check for vulnerable dependencies
      run: ./gradlew dependencyCheckAnalyze --no-daemon

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: build/reports/dependency-check-report.html
        retention-days: 30

  # Test coverage
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run tests with coverage
      run: |
        ./gradlew clean
        ./gradlew test jacocoTestReport --no-daemon

    - name: Check coverage thresholds
      run: |
        # Check if coverage meets minimum thresholds
        COVERAGE=$(grep -o 'Total.*[0-9]*%' build/reports/jacoco/test/html/index.html | grep -o '[0-9]*%' | head -1 | sed 's/%//')
        echo "Coverage: $COVERAGE%"

        if [ "$COVERAGE" -lt 80 ]; then
          echo "Coverage below 80% threshold"
          exit 1
        fi

        echo "Coverage threshold met: $COVERAGE%"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/
        retention-days: 30

  # Build verification
  build-gate:
    name: Build Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Verify build
      run: |
        ./gradlew clean
        ./gradlew build -x test --no-daemon

    - name: Verify distribution
      run: |
        ./gradlew distZip --no-daemon

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          build/libs/
          build/distributions/
        retention-days: 30

  # Documentation check
  docs-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Generate Javadoc
      run: ./gradlew javadoc --no-daemon

    - name: Check for documentation warnings
      run: |
        # Check if Javadoc generation had warnings
        if grep -r "warning:" build/docs/javadoc/; then
          echo "Javadoc warnings detected"
          exit 1
        fi
        echo "No Javadoc warnings found"

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation
        path: build/docs/javadoc/
        retention-days: 30

  # Performance check
  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run performance tests
      run: |
        ./gradlew clean
        ./gradlew build -x test --no-daemon
        ./gradlew jmh --no-daemon

    - name: Check performance regression
      run: |
        # Basic performance check - could be enhanced with historical comparison
        echo "Performance tests completed"

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: build/reports/jmh/
        retention-days: 30

  # Quality gate summary
  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [quality-gate, security-gate, coverage-gate, build-gate, docs-gate, performance-gate]
    if: always()

    steps:
    - name: Generate quality report
      run: |
        echo "# Quality Gate Summary" > quality-summary.md
        echo "" >> quality-summary.md
        echo "## Status Overview" >> quality-summary.md
        echo "- Code Quality: ${{ needs.quality-gate.result }}" >> quality-summary.md
        echo "- Security: ${{ needs.security-gate.result }}" >> quality-summary.md
        echo "- Test Coverage: ${{ needs.coverage-gate.result }}" >> quality-summary.md
        echo "- Build: ${{ needs.build-gate.result }}" >> quality-summary.md
        echo "- Documentation: ${{ needs.docs-gate.result }}" >> quality-summary.md
        echo "- Performance: ${{ needs.performance-gate.result }}" >> quality-summary.md
        echo "" >> quality-summary.md

        # Determine overall status
        FAILED_JOBS=0
        if [ "${{ needs.quality-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi
        if [ "${{ needs.security-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi
        if [ "${{ needs.coverage-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi
        if [ "${{ needs.build-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi
        if [ "${{ needs.docs-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi
        if [ "${{ needs.performance-gate.result }}" = "failure" ]; then FAILED_JOBS=$((FAILED_JOBS + 1)); fi

        if [ $FAILED_JOBS -eq 0 ]; then
          echo "## ✅ Quality Gate: PASSED" >> quality-summary.md
        else
          echo "## ❌ Quality Gate: FAILED ($FAILED_JOBS jobs failed)" >> quality-summary.md
        fi

        echo "" >> quality-summary.md
        echo "## Details" >> quality-summary.md
        echo "- Pull Request: #${{ github.event.pull_request.number }}" >> quality-summary.md
        echo "- Branch: ${{ github.head_ref }}" >> quality-summary.md
        echo "- Commit: ${{ github.sha }}" >> quality-summary.md
        echo "- Workflow: [Quality Gate #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> quality-summary.md

    - name: Upload quality summary
      uses: actions/upload-artifact@v4
      with:
        name: quality-summary
        path: quality-summary.md
        retention-days: 30

    - name: Comment on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('quality-summary.md', 'utf8');

          // Check if comment already exists
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const existingComment = comments.data.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Quality Gate Summary')
          );

          const commentBody = `## 🔍 Quality Gate Summary\n\n${summary}\n\n---\n*Generated by [GitHub Actions](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: commentBody
            });
            console.log('Updated existing quality gate comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            console.log('Created new quality gate comment');
          }

    - name: Fail if quality gate failed
      if: |
        needs.quality-gate.result == 'failure' ||
        needs.security-gate.result == 'failure' ||
        needs.coverage-gate.result == 'failure' ||
        needs.build-gate.result == 'failure' ||
        needs.docs-gate.result == 'failure' ||
        needs.performance-gate.result == 'failure'
      run: |
        echo "Quality gate failed. Please fix the issues before merging."
        exit 1
