name: Scheduled Tasks

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
    # Run every Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # Nightly build and test
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build project
      run: |
        ./gradlew clean
        ./gradlew build -x test

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Generate test report
      run: ./gradlew jacocoTestReport --no-daemon

    - name: Upload nightly build
      uses: actions/upload-artifact@v4
      with:
        name: nightly-build-${{ github.run_number }}
        path: |
          build/libs/
          build/distributions/
          build/reports/
        retention-days: 7

  # Dependency updates
  dependency-updates:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Check for dependency updates
      run: |
        ./gradlew dependencyUpdates --no-daemon

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-updates-${{ github.run_number }}
        path: build/reports/dependencyUpdates/
        retention-days: 30

    - name: Create issue for outdated dependencies
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          try {
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'build/reports/dependencyUpdates/report.txt');
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔍 Dependency Updates Available',
                body: `## Dependency Update Report

                The following dependencies have updates available:

                \`\`\`
                ${report}
                \`\`\`

                **Generated on:** ${new Date().toISOString()}
                **Workflow:** [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

                ---
                *This issue was automatically generated by the scheduled dependency check workflow.*`,
                labels: ['dependencies', 'automated', 'maintenance']
              });

              console.log(`Created issue #${issue.data.number}`);
            }
          } catch (error) {
            console.error('Error creating issue:', error);
          }

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run security scan
      run: |
        ./gradlew dependencyCheckAnalyze --no-daemon

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-${{ github.run_number }}
        path: build/reports/dependency-check-report.html
        retention-days: 90

    - name: Create security issue if vulnerabilities found
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Security Vulnerabilities Detected',
            body: `## Security Scan Alert

            Security vulnerabilities were detected in the project dependencies.

            **Scan Date:** ${new Date().toISOString()}
            **Workflow:** [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### Next Steps:
            1. Review the security report in the workflow artifacts
            2. Update vulnerable dependencies
            3. Test the application after updates
            4. Re-run the security scan

            ---
            *This issue was automatically generated by the scheduled security scan workflow.*`,
            labels: ['security', 'automated', 'high-priority']
          });

          console.log(`Created security issue #${issue.data.number}`);

  # Code quality analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run code quality checks
      run: |
        ./gradlew check --no-daemon
        ./gradlew spotlessCheck --no-daemon

    - name: Generate code quality report
      run: |
        ./gradlew jacocoTestReport --no-daemon
        ./gradlew spotbugsMain --no-daemon

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-${{ github.run_number }}
        path: |
          build/reports/
          build/docs/
        retention-days: 30

  # Performance testing
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Run performance tests
      run: |
        ./gradlew clean
        ./gradlew build -x test
        ./gradlew jmh --no-daemon

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-test-${{ github.run_number }}
        path: build/reports/jmh/
        retention-days: 30

  # Documentation generation
  docs-generation:
    name: Generate Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Generate Javadoc
      run: ./gradlew javadoc --no-daemon

    - name: Generate project reports
      run: |
        ./gradlew projectReport --no-daemon
        ./gradlew dependencyReport --no-daemon

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation-${{ github.run_number }}
        path: |
          build/docs/
          build/reports/
        retention-days: 30

  # Summary report
  summary:
    name: Generate Summary Report
    runs-on: ubuntu-latest
    needs: [nightly-build, dependency-updates, security-scan, code-quality, performance-test, docs-generation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Generate summary report
      run: |
        echo "# Nightly Build Summary - $(date)" > summary.md
        echo "" >> summary.md
        echo "## Build Status" >> summary.md
        echo "- Nightly Build: ${{ needs.nightly-build.result }}" >> summary.md
        echo "- Dependency Check: ${{ needs.dependency-updates.result }}" >> summary.md
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> summary.md
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> summary.md
        echo "- Performance Test: ${{ needs.performance-test.result }}" >> summary.md
        echo "- Documentation: ${{ needs.docs-generation.result }}" >> summary.md
        echo "" >> summary.md
        echo "## Workflow Details" >> summary.md
        echo "- Run Number: ${{ github.run_number }}" >> summary.md
        echo "- Commit: ${{ github.sha }}" >> summary.md
        echo "- Branch: ${{ github.ref_name }}" >> summary.md
        echo "- Triggered: ${{ github.event_name }}" >> summary.md

    - name: Upload summary report
      uses: actions/upload-artifact@v4
      with:
        name: summary-report-${{ github.run_number }}
        path: summary.md
        retention-days: 7

    - name: Comment on commit (if available)
      uses: actions/github-script@v7
      if: github.event_name == 'push'
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');

          try {
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 📊 Nightly Build Summary\n\n${summary}\n\n---\n*Generated by [GitHub Actions](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
            });
            console.log('Commented on commit');
          } catch (error) {
            console.log('Could not comment on commit (may not have permission)');
          }
