# Pre-commit cho bản Kotlin/Compose — chạy `pre-commit install` sau khi clone.
# Legacy Java-era config đã xoá cùng tag java-legacy; bản này thay spotless .java bằng ktlint .kt.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-json
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: gradlew\.bat
  - id: detect-private-key
- repo: local
  hooks:
  - id: gradle-spotless-check
    name: Spotless (ktlint) check
    entry: ./gradlew spotlessCheck -q
    language: system
    files: \.kts?$
    pass_filenames: false
  - id: gradle-detekt
    name: detekt (static analysis)
    entry: ./gradlew detekt -q
    language: system
    files: \.kts?$
    pass_filenames: false
  - id: gradle-compile
    name: compile mọi target (JVM + Android)
    entry: ./gradlew :engine:compileKotlinJvm :app-shared:compileKotlinJvm :desktop-app:compileKotlin :android-app:compileDebugKotlin -q
    language: system
    files: \.kts?$
    pass_filenames: false
