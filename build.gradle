// Legacy Java app đã xoá (tag java-legacy) — bản Kotlin/Compose ở :engine, :app-shared, :desktop-app.
// Root project host các module + tập trung version plugin (apply false) để dùng chung 1 classloader —
// khai báo version ở pluginManagement/subproject sẽ nạp Kotlin plugin nhiều lần.
plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.10' apply false
        id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10' apply false
    id 'org.jetbrains.compose' version '1.12.0' apply false
    id 'com.android.application' version '9.1.1' apply false
    id 'com.android.kotlin.multiplatform.library' version '9.1.1' apply false
    id 'com.android.test' version '9.1.1' apply false
        id 'com.diffplug.spotless' version '8.10.0' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

// Format Kotlin mọi module từ 1 chỗ — pre-commit chạy `./gradlew spotlessCheck`.
subprojects {
    apply plugin: 'com.diffplug.spotless'
    spotless {
        kotlin {
            target('src/**/*.kt')
            ktlint('1.8.0').editorConfigOverride(['ktlint_standard_no-unused-imports': 'enabled'])
        }
    }
}

// Static analysis Kotlin mọi module — `./gradlew detekt` (format là việc của ktlint).
subprojects {
    apply plugin: 'io.gitlab.arturbosch.detekt'
    detekt {
        buildUponDefaultConfig = true
        config.setFrom(rootProject.file('config/detekt/detekt.yml'))
        baseline = file("${projectDir}/detekt-baseline.xml")
        // KMP: detekt chỉ biết src/main|test mặc định — quét cả commonMain/jvmMain/androidMain
        source.setFrom('src')
    }
    dependencies {
        detektPlugins 'io.nlopez.compose.rules:detekt:0.4.22'
    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
kotlin {
    jvmToolchain(8)
}
