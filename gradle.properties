# Project configuration
org.gradle.jvmargs=-Xmx2g -Xms512m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Java configuration
java.sourceCompatibility=17
java.targetCompatibility=17

# Application properties (single source of truth)
app.name=LeechText
app.version=2.0.1
app.mainClass=dev.haipham22.leechtext.desktop.MainKt

# Encoding
file.encoding=UTF-8
project.build.sourceEncoding=UTF-8

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# AGP 9 built-in Kotlin — pin cùng version toolchain
kotlin.version=2.4.10

# Custom sharedMain intermediate (engine/ui share desktop+android) — tắt default
# hierarchy template khỏi đan edges song song với dependsOn tay (warning KGP 2.4;
# nghi ngờ liên quan bug compose-resources accessors trên file mới)
kotlin.mpp.applyDefaultHierarchyTemplate=false
