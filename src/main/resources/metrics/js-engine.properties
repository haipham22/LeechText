# GraalVM JavaScript Engine Performance Baselines
# Expected performance targets for JavaScript execution

# Startup time targets (milliseconds)
engine.startup.time.ms.lua=50
engine.startup.time.ms.js=200

# Simple script execution time (milliseconds)
engine.execution.time.ms.simple.lua=1
engine.execution.time.ms.simple.js=5
engine.execution.time.ms.simple.js.warm=0.5

# Memory usage targets (megabytes)
engine.memory.mb.lua=5
engine.memory.mb.js=50

# Resource limits
engine.pool.max.contexts=5
engine.execution.timeout.ms=30000
engine.context.max.memory.mb=50

# Performance ratios (acceptable)
engine.performance.ratio.startup=4.0
engine.performance.ratio.execution=5.0
engine.performance.ratio.memory=10.0
